spring.application.name=catalogo
server.port=${PORT:8081}

# Banco de dados: PostgreSQL no container minimercado-db (veja o README na raiz do projeto).
# Os valores padrão são só para o ambiente local; em outros ambientes use as variáveis DB_*.
spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5433/catalogo}
spring.datasource.username=${DB_USERNAME:minimercado}
spring.datasource.password=${DB_PASSWORD:minimercado}
spring.datasource.hikari.maximum-pool-size=${DB_POOL_SIZE:10}
spring.jpa.hibernate.ddl-auto=update
spring.jpa.open-in-view=false

# Envia ao front as mensagens de erro geradas pelo service.
spring.web.error.include-message=always
