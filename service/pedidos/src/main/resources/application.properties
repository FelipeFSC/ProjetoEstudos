spring.application.name=pedidos
server.port=${PORT:8082}

# Banco de dados: PostgreSQL no container minimercado-db (veja o README na raiz do projeto).
# Cada microsserviço tem o seu próprio banco. Os valores padrão são só para o ambiente local.
spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5433/pedidos}
spring.datasource.username=${DB_USERNAME:minimercado}
spring.datasource.password=${DB_PASSWORD:minimercado}
spring.datasource.hikari.maximum-pool-size=${DB_POOL_SIZE:10}
spring.jpa.hibernate.ddl-auto=update
spring.jpa.open-in-view=false

# Envia ao front as mensagens de erro geradas pelo service.
spring.web.error.include-message=always

# Serviço de catálogo
spring.http.clients.connect-timeout=5s
spring.http.clients.read-timeout=15s
mini-mercado.catalogo-url=${CATALOGO_URL:http://localhost:8081}
